name: Frontend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          UI_SCREENSHOT_DIR: artifacts/ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-screenshots
          path: artifacts/ui
          if-no-files-found: ignore
